[pytest]
pythonpath = .
testpaths = app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    no_llm_stub: do not patch OpenAIChatHTTPLLM (real HTTP tests)
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-report=term-missing
    --cov-report=xml

